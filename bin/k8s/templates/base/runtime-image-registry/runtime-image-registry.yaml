#
# Registry for runtime images built from user-supplied Dockerfiles.
#
# Two different clients have to agree on one address for an image, and they
# resolve names differently: the BuildKit job pushing the image is a pod and uses
# cluster DNS, while the kubelet pulling it is not and does not. A ClusterIP is
# the one address both can reach, which is why this Service pins one instead of
# letting Kubernetes assign it -- an image reference embeds the address, so it
# has to survive a reinstall of the chart.
#
# The registry is plain HTTP. That is only workable because container runtimes
# are already configured to treat the Service CIDR as insecure (minikube trusts
# 10.96.0.0/12 out of the box). A real deployment terminates TLS here and gives
# the pull a credential.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.runtimeImageRegistry.name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  clusterIP: {{ .Values.runtimeImageRegistry.clusterIP }}
  selector:
    app: {{ .Values.runtimeImageRegistry.name }}
  ports:
    - name: registry
      port: {{ .Values.runtimeImageRegistry.port }}
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.runtimeImageRegistry.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.runtimeImageRegistry.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.runtimeImageRegistry.name }}
    spec:
      containers:
        - name: registry
          image: {{ .Values.runtimeImageRegistry.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            # Rebuilding a runtime image reuses a tag, so the registry has to accept
            # an overwrite rather than reject it as immutable.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: images
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: images
          {{- if .Values.runtimeImageRegistry.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.runtimeImageRegistry.name }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.runtimeImageRegistry.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.runtimeImageRegistry.name }}-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.runtimeImageRegistry.persistence.size }}
{{- end }}
{{- end }}
