kubernetes {

  enabled = false
  enabled = ${?KUBERNETES_COMPUTING_UNIT_ENABLED}

  compute-unit-pool-name = "texera-workflow-computing-unit"
  compute-unit-pool-name = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAME}

  compute-unit-pool-namespace = "texera-workflow-computing-unit-pool"
  compute-unit-pool-namespace = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAMESPACE}

  compute-unit-service-name = "workflow-computing-unit-svc"
  compute-unit-service-name = ${?KUBERNETES_COMPUTE_UNIT_SERVICE_NAME}

  # Computing-unit pods are named "<prefix>-<cuid>". The mounter derives a CU's id back
  # out of the pod name, so both must be given the same value by the helm chart.
  compute-unit-pod-name-prefix = "computing-unit"
  compute-unit-pod-name-prefix = ${?KUBERNETES_COMPUTE_UNIT_POD_NAME_PREFIX}

  image-name = "bobbai/texera-workflow-computing-unit:dev"
  image-name = ${?KUBERNETES_IMAGE_NAME}

  image-pull-policy = "Always"
  image-pull-policy = ${?KUBERNETES_IMAGE_PULL_POLICY}

  port-num = 8085

  # Configuration on how many computing units one user can create
  max-num-of-running-computing-units-per-user = 10
  max-num-of-running-computing-units-per-user = ${?MAX_NUM_OF_RUNNING_COMPUTING_UNITS_PER_USER}

  computing-unit-cpu-limit-options = "1,2,4"
  computing-unit-cpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_CPU_LIMIT_OPTIONS}

  computing-unit-memory-limit-options = "1Gi,2Gi,4Gi"
  computing-unit-memory-limit-options = ${?KUBERNETES_COMPUTING_UNIT_MEMORY_LIMIT_OPTIONS}

  # GPU configuration
  computing-unit-gpu-limit-options = "0,1,2"
  computing-unit-gpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_GPU_LIMIT_OPTIONS}
  
  # GPU resource key used in Kubernetes (vendor-specific)
  computing-unit-gpu-resource-key = "nvidia.com/gpu"
  computing-unit-gpu-resource-key = ${?KUBERNETES_COMPUTING_UNIT_GPU_RESOURCE_KEY}

  # Per-node mounter (out-of-pod FUSE mounting). These must match the
  # texera-mounter DaemonSet's hostPort and hostPath in the helm chart.
  mounter-port = 8100
  mounter-port = ${?KUBERNETES_MOUNTER_PORT}

  mounter-host-root = "/var/lib/texera-mounts"
  mounter-host-root = ${?KUBERNETES_MOUNTER_HOST_ROOT}
}
# Runtime images: the image a computing unit runs, built from a user Dockerfile.
runtime-images {
  enabled = true
  enabled = ${?TEXERA_RUNTIME_IMAGES_ENABLED}

  # BuildKit rather than Kaniko, which was archived in June 2025. The rootless
  # variant is what lets the build run without a privileged pod.
  builder-image = "moby/buildkit:v0.18.2-rootless"
  builder-image = ${?TEXERA_RUNTIME_IMAGE_BUILDER_IMAGE}

  # Where build jobs run. Defaults to the computing-unit pool namespace, which
  # already exists and is already where user-triggered workloads land.
  build-namespace = "texera-workflow-computing-unit-pool"
  build-namespace = ${?TEXERA_RUNTIME_IMAGE_BUILD_NAMESPACE}

  # Registry that built images are pushed to and pulled from. This address is
  # embedded in every image reference, so changing it orphans existing images.
  registry = "10.96.0.99:5000"
  registry = ${?TEXERA_RUNTIME_IMAGE_REGISTRY}

  # Prefilled into a new runtime image's editor, and what user Dockerfiles build
  # FROM. Published by bin/k8s/push-base-image.sh.
  base-image = "10.96.0.99:5000/texera/computing-unit-master:dev"
  base-image = ${?TEXERA_RUNTIME_IMAGE_BASE_IMAGE}

  # A build past this is killed, so a runaway Dockerfile cannot hold a slot forever.
  build-timeout-seconds = 3600
  build-timeout-seconds = ${?TEXERA_RUNTIME_IMAGE_BUILD_TIMEOUT_SECONDS}

  build-cpu-request = "1"
  build-cpu-request = ${?TEXERA_RUNTIME_IMAGE_BUILD_CPU_REQUEST}
  build-memory-request = "2Gi"
  build-memory-request = ${?TEXERA_RUNTIME_IMAGE_BUILD_MEMORY_REQUEST}
  build-cpu-limit = "2"
  build-cpu-limit = ${?TEXERA_RUNTIME_IMAGE_BUILD_CPU_LIMIT}
  build-memory-limit = "4Gi"
  build-memory-limit = ${?TEXERA_RUNTIME_IMAGE_BUILD_MEMORY_LIMIT}
}
